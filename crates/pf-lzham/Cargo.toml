[package]
name = "pf-lzham"
description = "LZHAM (alpha) decompression for Titanfall PC VPK chunks; native only"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# MIT. Builds the bundled lzham_alpha C++ library (MIT, Rich Geldreich) with
# CMake. Needs CMake on PATH or the CMAKE env var pointing at cmake.exe.
lzham-alpha-sys = "0.1.1"

# Not `workspace = true`: the workspace forbids unsafe code, and this crate is
# the one place that calls C. The unsafe is confined to `decompress`.
[lints.rust]
unsafe_code = "deny"
