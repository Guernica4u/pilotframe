[package]
name = "pf-game"
description = "Pilotframe game app: menus, map select, pilot movement in the test map or Colony"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# `file_watcher` reloads assets/movement.ron while the game runs.
bevy = { workspace = true, features = ["file_watcher"] }
leafwing-input-manager.workspace = true
pf-movement.workspace = true
ron.workspace = true
pf-world = { path = "../pf-world" }
pf-fmt-mdl = { path = "../pf-fmt-mdl" }
pf-fmt-vtf = { path = "../pf-fmt-vtf" }
pf-fmt-ui = { path = "../pf-fmt-ui" }
pf-clientvm = { path = "../pf-clientvm" }
pf-vgui = { path = "../pf-vgui" }
pf-squirrel = { path = "../pf-squirrel" }
serde.workspace = true

[lints]
workspace = true
