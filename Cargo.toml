[workspace]
resolver = "3"
members = ["crates/*", "Tools/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "GPL-3.0-only"
publish = false

[workspace.dependencies]
pf-vfs = { path = "crates/pf-vfs" }
pf-xdvdfs = { path = "crates/pf-xdvdfs" }
pf-testdata = { path = "crates/pf-testdata" }
pf-movement = { path = "crates/pf-movement" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# Bevy breaks its API every few months, so the whole workspace pins one version (PLAN §2).
bevy = "=0.19.1"
leafwing-input-manager = "=0.21.0"
# Must match the glam that Bevy uses, so `Vec3` is the same type on both sides.
glam = { version = "0.32", features = ["serde"] }
parry3d = "0.31"
ron = "0.12"

[workspace.lints.rust]
unsafe_code = "forbid"
